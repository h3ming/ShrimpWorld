---
layout: default
---

<h1>Tag: {{ page.tag }}</h1>

<div class="post-list">
  {% for post in site.posts %}
    {% if post.tags contains page.tag %}
      <div class="post-card">

        <h2>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>

        <p>
          {{ post.date | date: "%b %d, %Y" }}
        </p>

        <p>
          {{ post.excerpt | strip_html | truncatewords: 25 }}
        </p>

      </div>
    {% endif %}
  {% endfor %}
</div>
