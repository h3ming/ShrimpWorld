---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %d %Y" }}</p>

  {{ content }}

  {% if page.image %}
  <img src="{{ page.image }}" class="post-image">
{% endif %}
</article>

<div class="post-nav">

  {% if page.previous %}
    <a class="nav-arrow prev" href="{{ page.previous.url }}">
      ← Previous Entry
    </a>
  {% endif %}

  {% if page.next %}
    <a class="nav-arrow next" href="{{ page.next.url }}">
      Next Entry →
    </a>
  {% endif %}

</div>
